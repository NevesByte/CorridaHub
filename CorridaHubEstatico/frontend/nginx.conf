server {
    listen 81;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /corridasHub/ {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        try_files $uri $uri/ =404;
    }

    location /img/ {
        try_files $uri $uri/ =404;
    }

    location /publiqueCorridas/ {
        try_files $uri $uri/ =404;
    }

    location /secoes/ {
        try_files $uri $uri/ =404;
    }
}